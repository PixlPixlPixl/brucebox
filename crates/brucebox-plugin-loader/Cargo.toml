[package]
name = "brucebox-plugin-loader"
version = "0.1.0"
edition = "2024"

# Native plugin loading. All `unsafe` for symbol resolution lives in this crate:
# nothing outside it touches a library handle, and the folder format it trusts is
# read by `brucebox-plugin-manifest`.

[dependencies]

[dependencies.brucebox-plugin-api]
path = "../brucebox-plugin-api"

[dependencies.brucebox-plugin-manifest]
path = "../brucebox-plugin-manifest"

[dependencies.libloading]
version = "0.9"
